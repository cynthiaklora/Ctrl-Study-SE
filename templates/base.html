<!-- This file is the base file. It has the head data and the navigation bar. This data is extended by the other html files. -->

<!doctype html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% if title %}
    <title>{{ title }}</title>
    {% else %}
    <title>Ctrl Study</title>
    {% endif %}
    <!-- reads theme from local storage and applys when the page loads
     uses system if nothing was saved-->
    <script>
        const savedTheme = localStorage.getItem("theme") ||"system";
        document.documentElement.dataset.theme = savedTheme;
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    {% block head %}
    {% endblock %}
</head>

<body>
    <div class="headerContainer">
        <div style="margin-bottom: 15px; padding-top: 5px; top:0; margin: 8px; margin-top: 0;">
            <!-- add the theme button beside the home button-->
            <strong>Ctrl Study</strong> |
            <a href="/" class="btn">Home</a>
            <div class = "theme-dropdown" >
                 <button 
                type = "button"
                id = "mode-toggle"
                aria-expanded = "false"
                aria-controls = "theme-picker"
                >Theme
                <!-- this is where the theme dropdown with options is created-->
            </button>
            <span id = "theme-picker" hidden>
                <label for = "theme-select" > Choose theme:</label>
                <select id = "theme-select">
                    <option value = "system">System default</option>
                    <option value = "light">Light</option>
                    <option value = "dark" >Dark</option>
                    <option value = "blue" >Blue</option>
                    <option value = "red" >Red</option>
                </select>
            </span>
            </div>
            {% if current_user.is_authenticated %}
            <a href="/logout" class="btn">Logout</a>
            {% endif %}
            {% block headerbar %}
            {% endblock %}
        </div>
        <hr />
    </div>

    <div style="margin: 8px;">
        {% block body %}
        {% endblock %}
    </div>
    <!--shows the theme button when its clicked-->
    <script>
        const button = document.getElementById("mode-toggle");
        const picker = document.getElementById("theme-picker");
        const select = document.getElementById("theme-select");
        select.value = document.documentElement.dataset.theme;

        // updates the toggle when clicked
        button.onclick = () => {
            picker.hidden = !picker.hidden;
            button.setAttribute("aria-expanded", String(!picker.hidden))
        };

        // this applies the selected theme to <html> 
        select.onchange = () => {
            document.documentElement.dataset.theme = select.value;
            localStorage.setItem("theme", select.value);
        };
    </script>
</body>
</html>
